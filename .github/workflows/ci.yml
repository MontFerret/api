name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files are not formatted with gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test and build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go 1.25 on Ubuntu
            os: ubuntu-latest
            go-version: 1.25.x
          - name: Go 1.25 on macOS
            os: macos-latest
            go-version: 1.25.x
          - name: Go 1.25 on Windows
            os: windows-latest
            go-version: 1.25.x
          - name: Stable Go on Ubuntu
            os: ubuntu-latest
            go-version: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Test
        run: go test -count=1 -cover ./...

      - name: Build
        run: go build ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true
          cache: true

      - name: Test with the race detector
        run: go test -race -count=1 ./...
